manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    # Pull ZMK from urob's fork (needed for timer-less HRMs)
    - name: zmk
      remote: urob
      revision: main
      import: app/west.yml

    # Header helpers + behaviors
    - name: zmk-helpers
      remote: urob
      revision: main

    # Extra behaviors (auto-layer/tri-state) used for Num-Word, etc.
    - name: zmk-modules
      remote: urob
      revision: main

    # Your dongle screen module (keep this)
    - name: prospector-zmk-module
      remote: carrefinho
      revision: main

  self:
    path: config
